# LiteLLM Router Configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs
# Last Updated: 2026-03-06
# Status: TODO — model assignments are TBD, routing aliases defined below

# General settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # Injected by Infisical
  database_url: os.environ/DATABASE_URL           # Injected by Infisical

# Caching via Redis
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis-master.gateway.svc.cluster.local
    port: 6379
    password: os.environ/REDIS_PASSWORD           # Injected by Infisical

  # Langfuse observability callbacks
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
  langfuse_host: https://langfuse.jAIMS.app

# Model routing aliases
# 8 standard aliases for routing across providers
model_list:
  # smart — highest quality, most capable
  - model_name: smart
    litellm_params:
      model: openai/o3  # TODO: confirm model assignment
      api_key: os.environ/OPENAI_API_KEY

  # fast — lowest latency, lightweight tasks
  - model_name: fast
    litellm_params:
      model: openai/gpt-4o-mini  # TODO: confirm model assignment
      api_key: os.environ/OPENAI_API_KEY

  # code — code generation and analysis
  - model_name: code
    litellm_params:
      model: anthropic/claude-sonnet-4-5  # TODO: confirm model assignment
      api_key: os.environ/ANTHROPIC_API_KEY

  # reason — complex reasoning tasks
  - model_name: reason
    litellm_params:
      model: anthropic/claude-opus-4-5  # TODO: confirm model assignment
      api_key: os.environ/ANTHROPIC_API_KEY

  # long — long context window tasks
  - model_name: long
    litellm_params:
      model: google/gemini-2.0-flash  # TODO: confirm model assignment
      api_key: os.environ/GEMINI_API_KEY

  # complex — multi-step agentic tasks
  - model_name: complex
    litellm_params:
      model: openai/o3  # TODO: confirm model assignment
      api_key: os.environ/OPENAI_API_KEY

  # budget — cost-optimized tasks
  - model_name: budget
    litellm_params:
      model: openai/gpt-4o-mini  # TODO: confirm model assignment
      api_key: os.environ/OPENAI_API_KEY

  # embed — text embeddings
  - model_name: embed
    litellm_params:
      model: openai/text-embedding-3-small  # TODO: confirm model assignment
      api_key: os.environ/OPENAI_API_KEY
