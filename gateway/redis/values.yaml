# Redis Helm Values (Bitnami)
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/redis
# Last Updated: 2026-03-06
# Purpose: Response caching for LiteLLM gateway

# Use standalone mode (single replica, no replication for Phase 1)
architecture: standalone

auth:
  enabled: true
  # Password injected by Infisical operator via secrets/infisical/sync/redis-secrets.yaml
  existingSecret: redis-secret
  existingSecretPasswordKey: REDIS_PASSWORD

# Persistence — small volume for cache (not critical data)
master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Disable replica (standalone mode)
replica:
  replicaCount: 0
