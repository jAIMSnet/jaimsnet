# Kyverno Policy — Require Resource Limits
# Last Updated: 2026-03-06
# Status: ⬜ Phase 3 — TODO: configure and test

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/description: >-
      Require all containers to have CPU and memory limits.
spec:
  validationFailureAction: Audit  # TODO: change to Enforce after testing
  background: true
  rules:
    - name: check-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must have CPU and memory limits defined"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
