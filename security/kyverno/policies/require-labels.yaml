# Kyverno Policy — Require Standard Labels
# Last Updated: 2026-03-06
# Status: ⬜ Phase 3 — TODO: configure and test

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/description: >-
      Require all pods to have app.kubernetes.io/part-of label.
spec:
  validationFailureAction: Audit  # TODO: change to Enforce after testing
  background: true
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pod must have label 'app.kubernetes.io/part-of'"
        pattern:
          metadata:
            labels:
              app.kubernetes.io/part-of: "?*"
