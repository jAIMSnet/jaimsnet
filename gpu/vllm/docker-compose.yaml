# vLLM on AMD MI300X — GPU Inference
# Phase 2: When MI300X GPU Droplet is provisioned
# Last Updated: 2026-03-06
# Status: ⬜ Phase 2 — not yet deployed

# TODO: Configure when MI300X Droplet is available
services:
  vllm:
    image: vllm/vllm-openai:latest  # TODO: pin version
    container_name: vllm
    restart: unless-stopped
    # TODO: configure GPU device mapping for AMD MI300X
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/kfd:/dev/kfd
    ports:
      - "8000:8000"
    environment:
      # TODO: Set model path and config
      - MODEL_PATH=/models  # TODO: set to actual model
      - TENSOR_PARALLEL_SIZE=1
    volumes:
      - /mnt/models:/models  # TODO: configure model storage
    # TODO: Add health check
    deploy:
      resources:
        reservations:
          devices:
            - driver: amdgpu
              count: 1
              capabilities: [gpu]
