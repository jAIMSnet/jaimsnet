# ArgoCD Application — Prometheus
# Last Updated: 2026-03-06
# Status: ⬜ Phase 3

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jAIMSnet/jaimsnet
    targetRevision: HEAD
    path: observability/prometheus
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
