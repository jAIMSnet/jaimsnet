# Ansible Playbook — Deploy Uptime Kuma
# Last Updated: 2026-03-06
# Status: TODO — Phase 3

- name: Deploy Uptime Kuma
  hosts: uptime_kuma
  become: true
  tasks:
    - name: Copy docker-compose.yaml
      copy:
        src: ../../../observability/uptime-kuma/docker-compose.yaml
        dest: /opt/uptime-kuma/docker-compose.yaml
    - name: Start Uptime Kuma
      community.docker.docker_compose_v2:
        project_src: /opt/uptime-kuma
        state: present
