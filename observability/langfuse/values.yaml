# Langfuse Helm Values
# Docs: https://langfuse.com/docs/deployment/self-host
# Last Updated: 2026-03-06
# Status: TODO — Phase 1 deployment

# Resources — sized for DOKS Premium AMD node
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Database — DigitalOcean Managed PostgreSQL
# Credentials injected by Infisical via secrets/infisical/sync/langfuse-secrets.yaml
postgresql:
  enabled: false  # Using DO Managed PG
  # url set via LANGFUSE_DATABASE_URL secret

# Encryption
# LANGFUSE_SALT injected via secret

# Service
service:
  type: ClusterIP
  port: 3000

# Ingress handled separately via langfuse/ingress.yaml
ingress:
  enabled: false
