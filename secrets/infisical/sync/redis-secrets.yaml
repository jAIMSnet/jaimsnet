# InfisicalSecret CRD — Syncs secrets from Infisical → K8s Secret for Redis
# Docs: https://infisical.com/docs/integrations/platforms/kubernetes#infisicalsecret-crd
# Last Updated: 2026-03-06
# Status: TODO — configure Infisical project and environment paths

apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: redis-secrets
  namespace: gateway
spec:
  # TODO: Configure Infisical project and environment
  authentication:
    kubernetesAuth:
      identityId: ""  # TODO: Set from Infisical Kubernetes Auth identity
      serviceAccountRef:
        name: infisical-operator-controller-manager
        namespace: infisical

  infisical:
    projectId: ""     # TODO: Set from jaims-net project ID
    environment: prod
    secretPath: /

  # K8s Secret to create/update
  destination:
    secretName: redis-secret
    secretNamespace: gateway

  resyncIntervalSeconds: 60
